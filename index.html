<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أتمتة إنشاء الخطابات والتقارير</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; line-height: 1.6; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .checkbox-group { margin: 15px 0; }
  </style>
</head>
<body>

  <h2>أتمتة إنشاء الخطابات والتقارير</h2>

  <div class="form-group">
    <label>نوع المنشأة:</label>
    <select id="entityType">
      <option value="company">شركة</option>
      <option value="establishment">مؤسسة</option>
    </select>
  </div>

  <div class="form-group">
    <label>اسم المنشأة:</label>
    <input type="text" id="companyName" placeholder="أدخل اسم المنشأة">
  </div>

  <div class="form-group">
    <label>رقم السجل التجاري:</label>
    <input type="text" id="crNumber">
  </div>

  <div class="form-group">
    <label>المدينة / المقر:</label>
    <input type="text" id="location" value="الرياض">
  </div>

  <div class="form-group">
    <label>اليوم:</label>
    <input type="text" id="day" placeholder="مثال: الخميس">
  </div>

  <div class="form-group">
    <label>التاريخ الميلادي:</label>
    <input type="date" id="gDate">
  </div>

  <div class="form-group">
    <label>السنة المالية المنتهية في:</label>
    <input type="text" id="yearEnd" placeholder="مثال: 31 ديسمبر 2025">
  </div>

  <div class="form-group">
    <label>السنة المالية (مختصر):</label>
    <input type="text" id="yearEndShort" placeholder="مثال: 2025">
  </div>

  <div class="form-group">
    <label>اسم للشخص المخول / المدير:</label>
    <input type="text" id="authorizedPerson">
  </div>

  <div class="form-group">
    <label>تاريخ خطبة التعيين / المراجعة:</label>
    <input type="date" id="engagementDate">
  </div>

  <div class="form-group">
    <label>الشركاء / الأعضاء:</label>
    <div id="partnersContainer">
      <input type="text" class="partner-name" placeholder="اسم الشريك الأول" style="margin-bottom: 5px;">
    </div>
  </div>

  <hr>

  <div class="checkbox-group">
    <label><input type="checkbox" id="chk_appointment" checked> قرار التعيين (template1.docx)</label>
    <label><input type="checkbox" id="chk_representation" checked> خطاب التمثيل (representation_letter.docx)</label>
  </div>

  <button onclick="generateSelectedDocs()">توليد وتنزيل الخطابات المختارة</button>

  <div id="status" style="margin-top: 15px; font-weight: bold;"></div>

  <!-- استدعاء المكتبات -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- كود المعالجة -->
  <script>
    function processAndDownload(templateFile, outputFilename, data) {
      return fetch(templateFile + "?t=" + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`تعذر تحميل الملف ${templateFile}`);
          return res.arrayBuffer();
        })
        .then(buffer => {
          const zip = new PizZip(buffer);
          const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
          doc.render(data);
          const out = doc.getZip().generate({ type: "blob" });
          saveAs(out, outputFilename);
        });
    }

    function formatArabicDate(dateStr) {
      if (!dateStr) return "";
      const dateObj = new Date(dateStr);
      if (isNaN(dateObj)) return dateStr;

      const months = [
        "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
        "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
      ];

      const day = dateObj.getDate();
      const month = months[dateObj.getMonth()];
      const year = dateObj.getFullYear();

      return `${day} ${month} ${year}م`;
    }

    async function generateSelectedDocs() {
      const statusDiv = document.getElementById("status");
      const companyName = document.getElementById("companyName").value.trim();

      if (!companyName) {
        alert("يرجى إدخال اسم المنشأة أولاً!");
        return;
      }

      const doAppointment = document.getElementById("chk_appointment").checked;
      const doRepresentation = document.getElementById("chk_representation").checked;

      if (!doAppointment && !doRepresentation) {
        alert("يرجى اختيار خطاب واحد على الأقل للتوليد!");
        return;
      }

      statusDiv.style.color = "#d69e2e";
      statusDiv.innerText = "جاري إنشاء الخطابات...";

      const partnerInputs = document.querySelectorAll(".partner-name");
      const partnersData = [];
      partnerInputs.forEach(input => {
        const val = input.value ? input.value.trim() : "";
        if (val !== "") partnersData.push({ name: val });
      });

      const entityType = document.getElementById("entityType").value;
      const isProprietary = (entityType === "establishment");
      const rawDate = document.getElementById("gDate").value;

      const commonData = {
        day: document.getElementById("day").value,
        gDate: formatArabicDate(rawDate),
        companyName: companyName,
        crNumber: document.getElementById("crNumber").value,
        location: document.getElementById("location").value,
        yearEnd: document.getElementById("yearEnd").value,
        yearEndShort: document.getElementById("yearEndShort").value,
        authorizedPerson: document.getElementById("authorizedPerson").value,
        engagementDate: formatArabicDate(document.getElementById("engagementDate").value),
        partners: partnersData,
        isProprietary: isProprietary,
        
        entityWord: isProprietary ? "مؤسسة" : "شركة",
        entityThe: isProprietary ? "المؤسسة" : "الشركة",
        entityFor: isProprietary ? "لمؤسسة" : "لشركة",
        entityForThe: isProprietary ? "للمؤسسة" : "للشركة"
      };

      try {
        if (doAppointment) {
          await processAndDownload("template1.docx", `قرار_تعيين_${companyName}.docx`, commonData);
        }
        
        if (doAppointment && doRepresentation) {
          await new Promise(resolve => setTimeout(resolve, 1000));
        }

        if (doRepresentation) {
          await processAndDownload("representation_letter.docx", `خطاب_التمثيل_${companyName}.docx`, commonData);
        }

        statusDiv.style.color = "#38a169";
        statusDiv.innerText = "تم تنزيل جميع الخطابات المختارة بنجاح!";
      } catch (err) {
        console.error(err);
        statusDiv.style.color = "#e53e3e";
        statusDiv.innerText = "حدث خطأ أثناء الإنشاء، تأكد من رفع ملف القالب وتطابق الوسوم.";
      }
    }
  </script>
</body>
</html>
