<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أتمتة إنشاء الخطابات والتقارير</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7fafc; margin: 0; padding: 20px; color: #2d3748; }
    .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2b6cb0; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input[type="text"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
    .checkbox-group { border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; background-color: #ebf8ff; margin-bottom: 20px; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-weight: bold; color: #2b6cb0; }
    .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }
    .partner-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .btn { display: block; width: 100%; padding: 12px; background-color: #3182ce; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 15px; }
    .btn:hover { background-color: #2b6cb0; }
    .btn-add { background-color: #4299e1; padding: 8px; font-size: 14px; margin-top: 5px; }
    .btn-remove { background-color: #e53e3e; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
    .partners-box { border: 1px dashed #cbd5e0; padding: 15px; border-radius: 6px; margin-bottom: 20px; background-color: #f7fafc; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>أتمتة إنشاء الخطابات والتقارير</h2>

  <!-- تحديد الخطابات المراد توليدها -->
  <div class="checkbox-group">
    <label style="margin-bottom: 10px; font-size: 15px;">اختر الخطابات المطلوب إصدارها:</label>
    <div class="checkbox-item">
      <input type="checkbox" id="chk_appointment" checked>
      <label for="chk_appointment" style="margin:0; cursor:pointer;">قرار تعيين محاسب قانوني</label>
    </div>
    <div class="checkbox-item">
      <input type="checkbox" id="chk_representation" checked>
      <label for="chk_representation" style="margin:0; cursor:pointer;">خطاب التمثيل (Representation Letter)</label>
    </div>
  </div>

  <!-- نوع الكيان القانوني -->
  <div class="form-group">
    <label>نوع المنشأة / الكيان:</label>
    <select id="entityType">
      <option value="company">شركة (شركة ذات مسؤولية محدودة / مساهمة ...)</option>
      <option value="establishment">مؤسسة فردية</option>
    </select>
  </div>

  <div class="form-group">
    <label>اسم المنشأة:</label>
    <input type="text" id="companyName" placeholder="أدخل اسم الشركة أو المؤسسة">
  </div>

  <div class="form-group">
    <label>رقم السجل التجاري:</label>
    <input type="text" id="crNumber" placeholder="أدخل رقم السجل التجاري">
  </div>

  <div class="form-group">
    <label>المدينة/الموقع:</label>
    <input type="text" id="location" value="مدينة الرياض">
  </div>

  <div class="form-group">
    <label>اختر تاريخ الخطاب / القرار من التقويم:</label>
    <input type="date" id="datePicker" onchange="updateDateAndDay()">
  </div>

  <div class="form-group">
    <label>اليوم:</label>
    <select id="day">
      <option value="الأحد">الأحد</option>
      <option value="الإثنين">الإثنين</option>
      <option value="الثلاثاء">الثلاثاء</option>
      <option value="الأربعاء">الأربعاء</option>
      <option value="الخميس">الخميس</option>
      <option value="الجمعة">الجمعة</option>
      <option value="السبت">السبت</option>
    </select>
  </div>

  <div class="form-group">
    <label>التاريخ الصريح (تاريخ الخطاب):</label>
    <input type="text" id="gDate" placeholder="مثال: 29 يونيو 2026م">
  </div>

  <div class="form-group">
    <label>تاريخ خطاب التعيين / الارتباط المشار إليه في الفقرة الأولى:</label>
    <input type="text" id="engagementDate" placeholder="مثال: 29 أبريل 2026م">
  </div>

  <div class="form-group">
    <label>اختر تاريخ نهاية السنة المالية من التقويم:</label>
    <input type="date" id="yearEndPicker" onchange="updateYearEnd()">
  </div>

  <div class="form-group">
    <label>تاريخ نهاية السنة المالية (أرقام):</label>
    <input type="text" id="yearEndShort" placeholder="2025/12/31">
  </div>

  <div class="form-group">
    <label>تاريخ نهاية السنة المالية (نصاً):</label>
    <input type="text" id="yearEnd" placeholder="31 ديسمبر 2025">
  </div>

  <div class="form-group">
    <label>اسم الشخص المفوض بتوقيع العقد:</label>
    <input type="text" id="authorizedPerson" placeholder="اسم المفوض">
  </div>

  <div class="partners-box">
    <label>أسماء الشركاء (جدول التوقيعات):</label>
    <div id="partnersContainer">
      <div class="partner-row">
        <input type="text" class="partner-name" placeholder="اسم الشريك">
      </div>
    </div>
    <button type="button" class="btn btn-add" onclick="addPartner()">+ إضافة شريك آخر</button>
  </div>

  <button class="btn" onclick="generateSelectedDocs()">توليد وتنزيل الخطابات المختارة</button>

  <div id="status"></div>
</div>

<script>
const monthsArabic = [
  "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
  "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
];

window.onload = function() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  
  document.getElementById("datePicker").value = `${yyyy}-${mm}-${dd}`;
  updateDateAndDay();

  const lastYear = yyyy - 1;
  document.getElementById("yearEndPicker").value = `${lastYear}-12-31`;
  updateYearEnd();
};

function updateDateAndDay() {
  const dateVal = document.getElementById("datePicker").value;
  if (!dateVal) return;

  const dateObj = new Date(dateVal + "T00:00:00");
  const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  
  document.getElementById("day").value = days[dateObj.getDay()];

  const year = dateObj.getFullYear();
  const month = dateObj.getMonth();
  const day = dateObj.getDate();
  
  const formattedDate = `${day} ${monthsArabic[month]} ${year}م`;
  document.getElementById("gDate").value = formattedDate;
  document.getElementById("engagementDate").value = formattedDate;
}

function updateYearEnd() {
  const dateVal = document.getElementById("yearEndPicker").value;
  if (!dateVal) return;

  const dateObj = new Date(dateVal + "T00:00:00");
  const year = dateObj.getFullYear();
  const month = dateObj.getMonth();
  const monthNum = String(month + 1).padStart(2, '0');
  const day = String(dateObj.getDate()).padStart(2, '0');

  document.getElementById("yearEndShort").value = `${year}/${monthNum}/${day}`;
  document.getElementById("yearEnd").value = `${day} ${monthsArabic[month]} ${year}`;
}

function addPartner() {
  const container = document.getElementById("partnersContainer");
  const div = document.createElement("div");
  div.className = "partner-row";
  div.innerHTML = `
    <input type="text" class="partner-name" placeholder="اسم الشريك">
    <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(div);
}

async function generateSelectedDocs() {
  const statusDiv = document.getElementById("status");
  const companyName = document.getElementById("companyName").value.trim();

  if (!companyName) {
    alert("يرجى إدخال اسم المنشأة أولاً!");
    return;
  }

  const doAppointment = document.getElementById("chk_appointment").checked;
  const doRepresentation = document.getElementById("chk_representation").checked;

  if (!doAppointment && !doRepresentation) {
    alert("يرجى اختيار خطاب واحد على الأقل للتوليد!");
    return;
  }

  statusDiv.style.color = "#d69e2e";
  statusDiv.innerText = "جاري إنشاء الخطابات...";

  const partnerInputs = document.querySelectorAll(".partner-name");
  const partnersData = [];
  partnerInputs.forEach(input => {
    const val = input.value ? input.value.trim() : "";
    if (val !== "") partnersData.push({ name: val });
  });

  const entityType = document.getElementById("entityType").value;
  const isProprietary = (entityType === "establishment");

  const commonData = {
    day: document.getElementById("day").value,
    gDate: document.getElementById("gDate").value,
    companyName: companyName,
    crNumber: document.getElementById("crNumber").value,
    location: document.getElementById("location").value,
    yearEnd: document.getElementById("yearEnd").value,
    yearEndShort: document.getElementById("yearEndShort").value,
    authorizedPerson: document.getElementById("authorizedPerson").value,
    engagementDate: document.getElementById("engagementDate").value,
    partners: partnersData,
    isProprietary: isProprietary,
    entityWord: isProprietary ? "مؤسسة" : "شركة",
    entityForWord: isProprietary ? "لمؤسسة" : "لشركة"
  };

  try {
    if (doAppointment) {
      await processAndDownload("template1.docx", `قرار_تعيين_${companyName}.docx`, commonData);
    }
    if (doRepresentation) {
      await processAndDownload("representation_letter.docx", `خطاب_التمثيل_${companyName}.docx`, commonData);
    }

    statusDiv.style.color = "#38a169";
    statusDiv.innerText = "تم تنزيل جميع الخطابات المختارة بنجاح!";
  } catch (err) {
    console.error(err);
    statusDiv.style.color = "#e53e3e";
    statusDiv.innerText = "حدث خطأ أثناء الإنشاء: " + err.message;
  }
}

function processAndDownload(templateFile, outputFilename, data) {
  return fetch(templateFile + "?t=" + Date.now())
    .then(res => {
      if (!res.ok) throw new Error(`تعذر تحميل الملف ${templateFile} (رمز: ${res.status})`);
      return res.arrayBuffer();
    })
    .then(buffer => {
      const zip = new PizZip(buffer);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
      doc.render(data);
      const out = doc.getZip().generate({ type: "blob" });
      saveAs(out, outputFilename);
    });
}
</script>

</body>
</html>
