<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توليد الخطابات والتقارير</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 30px; direction: rtl; }
    .container { max-width: 500px; background: #fff; padding: 30px; border-radius: 12px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #333; margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #2d3748; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #218838; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>توليد الخطابات والتقارير</h2>
  
  <!-- قائمة اختيار نوع الخطاب المباشرة -->
  <div class="form-group">
    <label>اختر نوع الخطاب:</label>
    <select id="docType">
      <option value="template1.docx">خطاب المطلوبات</option>
      <option value="template2.docx">خطاب الإفصاح</option>
    </select>
  </div>

  <div class="form-group">
    <label>اسم الجهة:</label>
    <input type="text" id="companyName" placeholder="أدخل اسم الجهة" required>
  </div>

  <div class="form-group">
    <label>رقم السجل:</label>
    <input type="text" id="crNumber" placeholder="أدخل رقم السجل">
  </div>

  <div class="form-group">
    <label>اسم الموقع:</label>
    <input type="text" id="location" placeholder="أدخل اسم الموقع">
  </div>

  <div class="form-group">
    <label>التاريخ:</label>
    <input type="date" id="date">
  </div>

  <button onclick="generateDocument()">توليد وتنزيل الخطاب</button>

  <div id="status"></div>
</div>

<script>
function generateDocument() {
  const statusDiv = document.getElementById("status");
  const selectedTemplate = document.getElementById("docType").value;
  const companyName = document.getElementById("companyName").value;

  if (!companyName) {
    alert("يرجى إدخال اسم الجهة أولاً!");
    return;
  }

  statusDiv.style.color = "#d69e2e";
  statusDiv.innerText = "جاري إنشاء الخطاب...";

  // جلب قالب الوورد المربوط مباشرة من الموقع
  fetch(selectedTemplate)
    .then(response => {
      if (!response.ok) throw new Error("لم يتم العثور على ملف القالب في الموقع");
      return response.arrayBuffer();
    })
    .then(buffer => {
      const zip = new PizZip(buffer);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

      doc.render({
        companyName: companyName,
        crNumber: document.getElementById("crNumber").value,
        location: document.getElementById("location").value,
        date: document.getElementById("date").value
      });

      const out = doc.getZip().generate({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      });

      saveAs(out, "خطاب_" + companyName + ".docx");

      statusDiv.style.color = "#38a169";
      statusDiv.innerText = "تم تنزيل الخطاب بنجاح!";
    })
    .catch(error => {
      statusDiv.style.color = "#e53e3e";
      statusDiv.innerText = "خطأ: " + error.message;
      console.error(error);
    });
}
</script>

</body>
</html>
