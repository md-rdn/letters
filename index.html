<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توليد الخطابات والتقارير</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7fafc; margin: 0; padding: 20px; color: #2d3748; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2b6cb0; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    .partner-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .btn { display: block; width: 100%; padding: 12px; background-color: #3182ce; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background-color: #2b6cb0; }
    .btn-add { background-color: #4299e1; padding: 8px; font-size: 14px; margin-top: 5px; }
    .btn-remove { background-color: #e53e3e; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
    .partners-box { border: 1px dashed #cbd5e0; padding: 15px; border-radius: 6px; margin-bottom: 20px; background-color: #f7fafc; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>نظام توليد الخطابات والتقارير</h2>

  <div class="form-group">
    <label>اليوم (مثال: الأربعاء):</label>
    <input type="text" id="day" value="الأربعاء">
  </div>

  <div class="form-group">
    <label>التاريخ الهجري/الميلادي:</label>
    <input type="text" id="gDate" value="1447/08/29هـ الموافق 2026/02/18م">
  </div>

  <div class="form-group">
    <label>اسم الشركة:</label>
    <input type="text" id="companyName" placeholder="أدخل اسم الشركة">
  </div>

  <div class="form-group">
    <label>رقم السجل التجاري:</label>
    <input type="text" id="crNumber" placeholder="أدخل رقم السجل التجاري">
  </div>

  <div class="form-group">
    <label>المدينة/الموقع:</label>
    <input type="text" id="location" value="مدينة بريدة">
  </div>

  <div class="form-group">
    <label>تاريخ نهاية السنة المالية (نصاً):</label>
    <input type="text" id="yearEnd" value="31/ديسمبر">
  </div>

  <div class="form-group">
    <label>تاريخ نهاية السنة المالية (أرقام):</label>
    <input type="text" id="yearEndShort" value="2025/12/31">
  </div>

  <div class="form-group">
    <label>اسم الشخص المفوض بتوقيع العقد:</label>
    <input type="text" id="authorizedPerson" placeholder="اسم المفوض">
  </div>

  <div class="partners-box">
    <label>أسماء الشركاء (جدول التوقيعات):</label>
    <div id="partnersContainer">
      <div class="partner-row">
        <input type="text" class="partner-name" placeholder="اسم الشريك">
      </div>
    </div>
    <button type="button" class="btn btn-add" onclick="addPartner()">+ إضافة شريك آخر</button>
  </div>

  <button class="btn" onclick="generateResolution()">توليد وتنزيل القرار (Word)</button>

  <div id="status"></div>
</div>

<script>
function addPartner() {
  const container = document.getElementById("partnersContainer");
  const div = document.createElement("div");
  div.className = "partner-row";
  div.innerHTML = `
    <input type="text" class="partner-name" placeholder="اسم الشريك">
    <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(div);
}

function generateResolution() {
  const statusDiv = document.getElementById("status");
  const companyName = document.getElementById("companyName").value;

  if (!companyName) {
    alert("يرجى إدخال اسم الشركة أولاً!");
    return;
  }

  const partnerInputs = document.querySelectorAll(".partner-name");
  const partnersData = [];
  partnerInputs.forEach(input => {
    const val = input.value ? input.value.trim() : "";
    if (val !== "") {
      partnersData.push({ name: val });
    }
  });

  statusDiv.style.color = "#d69e2e";
  statusDiv.innerText = "جاري إنشاء القرار...";

  fetch("template1.docx?t=" + Date.now())
    .then(res => {
      if (!res.ok) throw new Error("تعذر الوصول لملف الوورد (كود الخطأ: " + res.status + ")");
      return res.arrayBuffer();
    })
    .then(buffer => {
      const zip = new PizZip(buffer);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

      doc.render({
        day: document.getElementById("day").value,
        gDate: document.getElementById("gDate").value,
        companyName: companyName,
        crNumber: document.getElementById("crNumber").value,
        location: document.getElementById("location").value,
        yearEnd: document.getElementById("yearEnd").value,
        yearEndShort: document.getElementById("yearEndShort").value,
        authorizedPerson: document.getElementById("authorizedPerson").value,
        partners: partnersData
      });

      const out = doc.getZip().generate({ type: "blob" });
      saveAs(out, "قرار_تعيين_محاسب_" + companyName + ".docx");

      statusDiv.style.color = "#38a169";
      statusDiv.innerText = "تم تنزيل القرار بنجاح!";
    })
    .catch(err => {
      console.error(err);
      statusDiv.style.color = "#e53e3e";
      statusDiv.innerText = "تفاصيل الخطأ: " + err.message;
    });
}
</script>

</body>
</html>
